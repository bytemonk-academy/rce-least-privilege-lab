<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Careers Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1d1d1f; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    .note { background: #fff7e0; border: 1px solid #f0d58a; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
    pre { background: #f4f4f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Demo Careers Portal</h1>
  <p class="note">Training app for the ByteMonk least-privilege lab. Upload only the synthetic
    resume in <code>fixtures/</code> or a PDF you made yourself.</p>
  <form id="apply">
    <label>Name <input name="name" required value="Jane Candidate"></label>
    <label>Email <input name="email" type="email" required value="jane@example.com"></label>
    <label>Position <input name="position" required value="Senior Software Engineer"></label>
    <label>Resume (PDF) <input name="resume" type="file" accept="application/pdf" required></label>
    <button type="submit">Apply (no login needed)</button>
  </form>
  <pre id="result" hidden></pre>
  <p>Recruiters: <a href="/api/applications">/api/applications</a> (HTTP Basic login).</p>
  <script>
    document.getElementById('apply').addEventListener('submit', async (event) => {
      event.preventDefault();
      const out = document.getElementById('result');
      const response = await fetch('/api/applications', { method: 'POST', body: new FormData(event.target) });
      out.hidden = false;
      out.textContent = response.status + ' ' + await response.text();
    });
  </script>
</body>
</html>
